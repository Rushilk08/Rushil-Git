<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sheet">

  <header class="masthead">
    <p class="book-label">Vol. I — kept since 2026</p>
    <h1 class="title">Student Registry</h1>
    <p class="subtitle">A roll of everyone enrolled. Add a name below and it joins the record.</p>
  </header>

  <div class="divider"></div>

  <section class="entry-form">
    <p class="form-heading">New entry</p>
    <form id="registry-form" novalidate>
      <div class="field full">
        <label for="f-name">Full name <span class="req">*</span></label>
        <input type="text" id="f-name" name="name" placeholder="e.g. Amara Okafor" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="f-roll">Roll no. / Student ID <span class="req">*</span></label>
        <input type="text" id="f-roll" name="rollNo" placeholder="e.g. 24-0187" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="f-class">Class / grade</label>
        <input type="text" id="f-class" name="className" placeholder="e.g. Grade 10-B" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-email">Email</label>
        <input type="email" id="f-email" name="email" placeholder="e.g. amara@school.edu" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-phone">Phone</label>
        <input type="tel" id="f-phone" name="phone" placeholder="optional" autocomplete="off">
      </div>
      <div class="form-actions">
        <button type="submit" class="submit" id="submit-btn">Add to registry</button>
        <span class="form-note" id="form-note"></span>
      </div>
    </form>
  </section>

  <section class="roster">
    <div class="roster-head">
      <p class="roster-title">The roll</p>
      <span class="roster-count" id="roster-count"></span>
    </div>

    <div class="search-field">
      <input type="text" id="search-input" placeholder="Search by name, ID, or class">
    </div>

    <div id="roster-container">
      <p class="loading-state">Opening the register…</p>
    </div>
  </section>

  <footer class="colophon">
    <p>Entries are stored in this browser. Clearing your browser data will clear the roll too.</p>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
