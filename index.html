<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registry System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <div>
                <p class="subtitle">Registry Management</p>
                <h1>Registered Records</h1>
            </div>

            <div class="record-count">
                <strong id="recordCount">0</strong>
                <span>Records</span>
            </div>
        </header>


        <!-- Add Record -->
        <section class="card">

            <h2>Add New Record</h2>

            <form id="recordForm">

                <input type="hidden" id="editId">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="registryId">Registry ID</label>
                        <input
                            type="text"
                            id="registryId"
                            placeholder="e.g. REG-001"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="name@example.com"
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input
                            type="text"
                            id="phone"
                            placeholder="Phone number"
                        >
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>

                        <select id="category">
                            <option value="Student">Student</option>
                            <option value="Faculty">Faculty</option>
                            <option value="Staff">Staff</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                </div>

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="btn primary"
                        id="submitButton"
                    >
                        Add Record
                    </button>

                    <button
                        type="button"
                        class="btn secondary"
                        id="cancelButton"
                        hidden
                    >
                        Cancel
                    </button>

                </div>

                <p id="formMessage"></p>

            </form>

        </section>


        <!-- Search -->
        <section class="card">

            <div class="search-row">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by name, ID, email or category..."
                >

                <select id="filterCategory">

                    <option value="All">
                        All Categories
                    </option>

                    <option value="Student">
                        Student
                    </option>

                    <option value="Faculty">
                        Faculty
                    </option>

                    <option value="Staff">
                        Staff
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>

        </section>


        <!-- Records -->
        <section class="card">

            <h2>Registry</h2>

            <div id="recordsList"></div>

        </section>

    </div>


    <script src="script.js"></script>

</body>
</html>
